name: CI Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Functional Tests
        run: pytest --html=report.html --self-contained-html

      - name: Non-functional Tests (Static Analysis)
        run: flake8 . --output-file flake8_report.txt || { cat flake8_report.txt; exit 1; }

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            report.html
            flake8_report.txt
