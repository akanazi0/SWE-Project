<!DOCTYPE html>
<html>
<head>
    <title>My Booked Events</title>
</head>
<body>
    <h2>My Booked Events</h2>
    <ul>
    {% for event in events %}
        <li>
            <strong>{{ event.name }}</strong> ({{ event.date }})<br>
            {{ event.description }}
        </li>
    {% else %}
        <li>You have not booked any events yet.</li>
    {% endfor %}
    </ul>
    <a href="{{ url_for('welcome') }}">Back to All Events</a>
</body>
</html>
