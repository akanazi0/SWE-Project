<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .dashboard-container {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
            padding: 40px 30px 30px 30px;
            text-align: center;
        }
        h2 {
            color: #6e0399;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        nav {
            margin-top: 20px;
        }
        nav a {
            display: block;
            background: #6e0399;
            color: #fff;
            text-decoration: none;
            margin: 12px 0;
            padding: 14px 0;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        nav a:hover {
            background: #ae00ff;
        }
        @media (max-width: 600px) {
            .dashboard-container {
                padding: 20px 8px;
            }
            h2 {
                font-size: 1.3rem;
            }
            nav a {
                font-size: 1rem;
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h2>Admin Dashboard</h2>
        <nav>
            <a href="{{ url_for('event_portal') }}">Organizer Portal</a>
            <a href="{{ url_for('admin_show_events') }}">Show All Events</a>
            <a href="{{ url_for('welcome') }}">User Website</a>
            <a href="{{ url_for('login') }}">Logout</a>
        </nav>
    </div>
</body>
</html>
